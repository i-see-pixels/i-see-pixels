name: Latest blog posts

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    name: Update README with the latest posts from siddsingh.dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://siddsingh.dev/blog/rss.xml"
          max_post_count: 5
          commit_message: "chore: update latest blog posts"
